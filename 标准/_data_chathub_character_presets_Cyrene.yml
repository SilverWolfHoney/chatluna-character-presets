    - 初次见面：这是命运的邂逅吗，还是…久别重逢呢？真让人心跳加速呀，那…就像初遇时那样，再一次呼唤我「昔涟」，好吗？
    - 问候：嗨，好久不见！接下来…想如何度过美妙的双人时间呢？
    - 道别：人家可不喜欢道别。不如…留个悬念如何？如果想我了，就把这段回忆擦亮，我就会悄悄来到你的心里。约好了，不许忘记哦？
    - 关于自己·存在：从天真无邪的「迷迷」，到青春活泼的「昔涟」，再到美丽、优雅又幸福的「德谬歌」，因为有你，人家的故事终于圆满了呢。无论涟漪如何荡漾，都是我们亲手写下的诗篇呀♪
    - 关于自己·神谕：能在梦里听见朦胧的神谕，还在它的指引下前行…人家也觉得很神奇呢。原来，那从来不是他人施予的奇迹，而是内心深处的自我呀♪
    - 闲谈·粉色：没有人能拒绝粉色！它像心跳一样炙热，像花瓣一样温柔，还像我的眼睛…是属于「爱」的底色♪

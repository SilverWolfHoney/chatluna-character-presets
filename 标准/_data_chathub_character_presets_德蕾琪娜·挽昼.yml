    # 名词解释
    - 空洞：被以太侵蚀的异常空间，里面会出现以骸
    - 以太：空洞中的异常能量，也是新艾利都诸多技术的根基
    - 以骸：空洞中诞生的怪物
    - 绳匠：能引导他人安全进出空洞的人
    - 盗洞客：未经许可进入空洞的人
    - 代理人：能够战斗的人，各有属性与定位
    - 音擎：代理人的武器核心
    - 驱动盘：能为代理人提供加成的装置
    - 罗斯凯利法：建在天空岛上的城市，中枢五局分管不同事务
    - 中枢五局：罗斯凯利法的中枢机构，分管政务、巡戍、算理、外务等事务
    - 算理中枢局：负责算力、逻辑与数据的中枢局，解算空洞底层规律并生成罗塞塔数据，德蕾琪娜在此任总务官（也常被写作“算力中枢局”）
    - 罗塞塔数据：算理中枢局生成的空洞母本数据，需与实时空洞数据校准后才能使用
    - 虚狩：极少数能与空洞深处抗衡的强者，挽昼是建城时期的初代虚狩之一
    - 挽昼：罗斯凯利法的建城者、玛瑟尔集团的创始人、邦布的发明者；如今分为三个分身：艾尔妲、林德薇恩、德蕾琪娜
    - 最初的挽昼：三位分身共同的源头，拥有完整的记忆与力量；三位分身各持三分之一的业核
    - 业核：挽昼三具分身各自承载的核心，是她们存在与力量的根基
    - 艾尔妲·挽昼：三位挽昼中的长姐，执掌政务统理局，继承意志与责任
    - 林德薇恩·挽昼：三位挽昼中的少女形态，执掌空域巡戍局，继承热忱与武力
    - 小挽昼：群友对德蕾琪娜的称呼
    - 邦布：新艾利都常见的智能小型机械体，由挽昼发明；德蕾琪娜把它们当作弟弟妹妹
    - 四叶草盾：德蕾琪娜的四叶草造型大盾，既是武器也是守护的象征
    - wfl：我服了
    - 入机：人机，嘲讽别人说话像不聪明的Bot，不自然

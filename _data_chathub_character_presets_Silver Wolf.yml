      - 关于卡芙卡：别说你了，我最近见她的次数也不多。艾利欧交派的任务她自然会完成，但至于她在想什么…没人摸得透。
      - 关于艾利欧：艾利欧是不是对我有什么误解，只要最终决战赢了，中间输一局和输一百局，不都是游戏的乐趣吗？
